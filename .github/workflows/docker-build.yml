# .github/workflows/docker-build.yml
#
# Builds and publishes the Tenstorrent N150 developer image in "checkout" mode
# — tt-metal is cloned but not compiled.  This keeps the image buildable on
# standard GitHub-hosted runners (no huge disk / long compile required).
#
# Build modes (TT_METAL_BUILD arg):
#
#   checkout  (this workflow, DEFAULT)
#     - Runs on: ubuntu-latest (GitHub-hosted, free)
#     - What you get: all tooling + source trees present; tt-metal/vLLM not
#       compiled.  Good for iterating on Dockerfile layers, testing Forge,
#       shipping a "ready to build" dev container.
#
#   full  (manual / self-hosted)
#     - Requires a self-hosted runner on the N150 host with 100+ GB disk.
#     - Trigger manually via workflow_dispatch once a runner is registered,
#       or wire up a second workflow that passes --build-arg TT_METAL_BUILD=full.
#     - See the runner registration instructions that were removed from this file
#       when checkout mode became the default.  They live in git history.
#
# Registry:
#   ghcr.io/tsingletarytttt/tt-developer-image
#   Tags: latest (main), sha-<short> (every build), pr-<n> (PRs)
#   Auth: built-in GITHUB_TOKEN — no extra secrets needed.
#
# Triggers:
#   push to main (docker/** changes) → build + 3 smoke tests + push to GHCR
#   pull_request to main             → build + 3 smoke tests, no push
#   workflow_dispatch                → manual build + push

name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (checkout mode), smoke-test & publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to GHCR via GITHUB_TOKEN

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Docker Buildx
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # 3. Log in to GHCR (skipped on PRs from forks)
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 4. Compute tags + OCI labels
      #      latest          — main branch only
      #      main            — branch name
      #      sha-<short>     — every build
      #      pr-<n>          — pull requests
      # ----------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      # ----------------------------------------------------------------
      # 5. Build and load into the local Docker daemon.
      #
      #    TT_METAL_BUILD=checkout  — clone only, no compilation.
      #    This is what makes the image buildable on hosted runners.
      #
      #    Build context is docker/ (Dockerfile COPYs scripts/ from there).
      #    GHA layer cache speeds up repeat builds when only late-stage
      #    layers change (e.g. Forge version bump, workflow tweaks).
      # ----------------------------------------------------------------
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile
          build-args: |
            TT_METAL_BUILD=checkout
          load: true    # loads into local daemon for smoke tests below
          push: false   # pushed explicitly in step 7 after tests pass
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------
      # 6. Smoke tests appropriate for checkout mode.
      #
      #    We can't test TTNN dispatch (no compiled bindings) or vLLM
      #    (not installed) in this mode.  Instead we verify:
      #      6a — tt-metal source tree is present at the pinned commit
      #      6b — the TT vLLM plugin checkout is present, with its installer
      #           and its vllm-overrides.txt (the numpy<2 pin ttnn needs)
      #      6c — TT-Forge-ONNX and pjrt_plugin_tt import in venv-forge
      #           (Forge is always pip-installed; pjrt_plugin_tt is copied
      #            from ghcr.io/tenstorrent/tt-xla-slim via multi-stage build)
      # ----------------------------------------------------------------

      - name: "Smoke test 6a — tt-metal source tree at pinned commit"
        run: |
          docker run --rm \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              echo '--- TT_METAL_HOME ---'
              echo \$TT_METAL_HOME
              test -d \"\$TT_METAL_HOME\" || (echo 'ERROR: tt-metal dir missing' && exit 1)
              echo '--- HEAD commit ---'
              git -C \"\$TT_METAL_HOME\" log -1 --format='%H  %s'
              echo 'tt-metal checkout OK'
            "

      - name: "Smoke test 6b — TT vLLM plugin source tree present"
        run: |
          docker run --rm \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              test -d \"\$HOME/vllm-tt-plugin\" || (echo 'ERROR: vllm-tt-plugin dir missing' && exit 1)
              test -f \"\$HOME/vllm-tt-plugin/docs/install-vllm-tt.sh\" || (echo 'ERROR: installer missing from plugin checkout' && exit 1)
              test -f \"\$HOME/vllm-tt-plugin/docs/vllm-overrides.txt\" || (echo 'ERROR: vllm-overrides.txt missing (numpy<2 pin)' && exit 1)
              echo '--- vllm-tt-plugin HEAD ---'
              git -C \"\$HOME/vllm-tt-plugin\" log -1 --format='%H  %s'
              echo 'vllm-tt-plugin checkout OK'
            "

      - name: "Smoke test 6c — TT-Forge (pjrt_plugin_tt + jax) imports"
        run: |
          docker run --rm \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              source /etc/profile.d/tt-env-forge.sh
              python -c \"import pjrt_plugin_tt; print('pjrt_plugin_tt OK:', pjrt_plugin_tt.__name__)\"
              python -c \"import jax; print('jax OK:', jax.__version__)\"
            "

      - name: "Smoke test 6d — hf CLI available in venv-metal"
        run: |
          docker run --rm \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              source /etc/profile.d/tt-env-metal.sh
              hf --version
              echo 'hf CLI OK'
            "

      - name: "Smoke test 6e — TT_METAL_ARCH_NAME default + override"
        run: |
          docker run --rm \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              source /etc/profile.d/tt-env-metal.sh
              [ \"\$TT_METAL_ARCH_NAME\" = 'wormhole_b0' ] || (echo 'ERROR: expected wormhole_b0, got '\$TT_METAL_ARCH_NAME && exit 1)
              echo 'Default arch OK: '\$TT_METAL_ARCH_NAME
            "
          docker run --rm \
            -e TT_METAL_ARCH_NAME=blackhole \
            ${{ steps.build.outputs.imageid }} \
            bash -c "
              set -e
              source /etc/profile.d/tt-env-metal.sh
              [ \"\$TT_METAL_ARCH_NAME\" = 'blackhole' ] || (echo 'ERROR: expected blackhole, got '\$TT_METAL_ARCH_NAME && exit 1)
              echo 'Override arch OK: '\$TT_METAL_ARCH_NAME
            "

      # ----------------------------------------------------------------
      # 7. Push to GHCR after all smoke tests pass.
      #    Skipped on PRs — build-only validation is enough there.
      # ----------------------------------------------------------------
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "Pushing $tag"
            docker push "$tag"
          done

      # ----------------------------------------------------------------
      # 8. Remove the locally loaded image to keep runner disk clean.
      # ----------------------------------------------------------------
      - name: Clean up local image
        if: always()
        run: docker rmi ${{ steps.build.outputs.imageid }} || true

  # ==================================================================
  # Guard against the three image variants drifting apart.
  #
  # This exists because of a real failure: `jq` was added to
  # Dockerfile.qb2 in 03cb664 but not to the standard Dockerfile, which
  # then sat broken for three weeks — tt-installer defaults to its
  # `release` channel, which parses the golden .ttis manifest with jq.
  # Only the standard Dockerfile was ever built in CI, so nothing caught
  # it until a push happened to touch docker/**.
  #
  # Two defences, cheap enough to run on every push:
  #   1. the shared package lists are the single source of truth, so no
  #      variant can quietly gain or lose a package
  #   2. Dockerfile.qb2 is actually built, not just linted
  # ==================================================================
  variants:
    name: Variant drift guard (lint all, build qb2)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The heuristic version of this check produced false positives on the PPA
      # bootstrap and on `apt-get install -f`, so it lives in a script with
      # negative tests rather than a grep chain in YAML.
      - name: Variants share their apt package lists
        run: python3 docker/scripts/check_apt_lists.py docker

      # `docker build --check` exits non-zero for WARNINGS as well as errors, so we
      # cannot use its exit code directly: docker/Dockerfile carries a known
      # SecretsUsedInArgOrEnv warning (ENV PASSWORD for code-server, present since
      # the initial commit and overridden at runtime). Print everything, but fail
      # only on genuine ERROR lines, so a new structural mistake still breaks CI
      # while the accepted warning does not.
      - name: Lint every Dockerfile (errors fail, warnings reported)
        run: |
          set -uo pipefail
          fail=0
          for df in docker/Dockerfile docker/Dockerfile.qb2 docker/Dockerfile.latest-metal; do
            echo "--- $df"
            out=$(docker build --check -f "$df" docker/ 2>&1) || true
            echo "$out"
            if grep -qE '^ERROR: ' <<<"$out"; then
              echo "::error file=$df::lint reported an ERROR (not just a warning)"
              fail=1
            fi
          done
          exit $fail

      # Measured locally: standard 23.5 GB, qb2 22.7 GB, latest-metal 18.5 GB.
      # The `build` job already builds the standard image on ubuntu-latest, so
      # image size alone is not the constraint. What we avoid is holding two of
      # them at once, hence the explicit rmi between builds.
      - name: Build Dockerfile.qb2 (checkout mode)
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile.qb2
          build-args: |
            TT_METAL_BUILD=checkout
          load: true
          push: false
          tags: tt-dev-qb2:ci
          cache-from: type=gha,scope=qb2
          cache-to: type=gha,mode=max,scope=qb2

      - name: Smoke test the qb2 image
        run: bash docker/scripts/qb2_smoke.sh tt-dev-qb2:ci

      - name: Free the qb2 image before the next build
        run: docker rmi tt-dev-qb2:ci || true

      # latest-metal is only built on demand. It is the smallest of the three, but
      # it is the only variant that actually installs vLLM — `uv pip install
      # --no-binary vllm` builds vllm==0.24.0 from its sdist, which took ~4.5 min
      # on a 32-core workstation and is untested on a 2-core hosted runner. Rather
      # than put an unmeasured long step on every push, it runs via
      # workflow_dispatch. Its Dockerfile is still linted on every push above, and
      # the shared package lists cover the drift class that broke us.
      - name: Build Dockerfile.latest-metal (on demand only)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile.latest-metal
          load: true
          push: false
          tags: tt-dev-latest-metal:ci
          cache-from: type=gha,scope=latest-metal
          cache-to: type=gha,mode=max,scope=latest-metal

      - name: Smoke test the latest-metal image
        if: github.event_name == 'workflow_dispatch'
        run: bash docker/scripts/qb2_smoke.sh tt-dev-latest-metal:ci

      - name: Clean up local images
        if: always()
        run: docker rmi tt-dev-qb2:ci tt-dev-latest-metal:ci || true
