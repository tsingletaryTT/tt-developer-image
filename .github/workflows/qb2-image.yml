# .github/workflows/qb2-image.yml
#
# OPTIONAL / DORMANT. The supported way to run these checks is the CLI script
# docker/scripts/ci-qb2.sh, run on the QuietBox itself — GitHub is not involved
# and no runner is registered (see README "QB2 image CI"). This workflow is kept
# only as a ready-made GitHub-native path IF a self-hosted runner labelled
# [self-hosted, tenstorrent] is ever registered. Until then it will not run:
# it is workflow_dispatch-only (no push trigger) so it never queues against a
# non-existent runner, and even a manual dispatch just waits until a runner
# exists.
#
# HOST SAFETY (mirrors ci-qb2.sh): every step runs inside Docker. The host's
# KMD / firmware / HugePages / system packages are NEVER modified. Real cards
# reach CI only via --device /dev/tenstorrent passthrough. The
# tenstorrent/tt-installer action runs inside a throwaway container.
#
# NO pull_request trigger — never run fork code on a hardware box.

name: QB2 Image CI (optional — needs a self-hosted runner)

on:
  workflow_dispatch:
    inputs:
      run_inference:
        description: "Full build + real inference on the cards (30-90 min)"
        type: boolean
        default: false

jobs:
  # -------------------------------------------------------------------------
  # Validate the golden version set installs clean, host-safe (throwaway
  # container). Publishes the resolved .ttis as an artifact.
  # -------------------------------------------------------------------------
  golden-stack:
    name: Golden stack via tt-installer action
    runs-on: [self-hosted, tenstorrent]
    container:
      image: ubuntu:24.04
    steps:
      - name: Install action prerequisites (bare ubuntu container has none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ca-certificates curl wget git jq \
            python3 python3-venv python3-pip

      - name: Install golden Tenstorrent stack (container mode)
        uses: tenstorrent/tt-installer@latest
        with:
          channel: release
          mode: container
          update-firmware: "off"
          container-runtime: "no"

      - name: Show resolved golden versions (.ttis)
        run: cat "${RUNNER_TEMP}/tt-installer-state.ttis" || echo "no .ttis found"

  # -------------------------------------------------------------------------
  # Build Dockerfile.qb2 (checkout) + smoke tests. (CLI equivalent: ci-qb2.sh)
  # -------------------------------------------------------------------------
  build-qb2:
    name: Build (checkout) + smoke tests
    runs-on: [self-hosted, tenstorrent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (checkout mode)
        run: |
          docker build \
            -f docker/Dockerfile.qb2 \
            --build-arg TT_METAL_BUILD=checkout \
            -t qb2-env:ci \
            docker/

      - name: Smoke test
        run: docker/scripts/qb2_smoke.sh qb2-env:ci

      - name: Clean up image
        if: always()
        run: docker rmi qb2-env:ci || true

  # -------------------------------------------------------------------------
  # Full build + real inference on the cards. On-demand only (30-90 min).
  # -------------------------------------------------------------------------
  inference:
    name: Full build + real inference (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.run_inference
    runs-on: [self-hosted, tenstorrent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (full mode — compiles TTNN)
        run: |
          docker build \
            -f docker/Dockerfile.qb2 \
            --build-arg TT_METAL_BUILD=full \
            -t qb2-env:ci-full \
            docker/

      - name: Real TTNN op on the cards (device passthrough)
        run: |
          docker run --rm \
            --device /dev/tenstorrent \
            -v /dev/hugepages-1G:/dev/hugepages-1G \
            -e TT_METAL_ARCH_NAME=blackhole \
            qb2-env:ci-full \
            bash -lc 'source "$HOME/tt-metal/python_env/bin/activate" && \
              python -c "import ttnn; d=ttnn.open_device(device_id=0); print(\"TTNN\", ttnn.__version__); ttnn.close_device(d)"'

      - name: Clean up image
        if: always()
        run: docker rmi qb2-env:ci-full || true
